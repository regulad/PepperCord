# Dependabot keeps every pinned version current: Python packages, the Dockerfile's images (uv, which also brings the
# interpreter's patch releases, and deno), GitHub Actions, and pre-commit hooks. Production's compose file, with its
# database images, lives in regulad/homelab, which keeps those current.
#
# Each ecosystem gets one PR a week grouping its minor and patch updates. workflows/dependabot-auto-merge.yml has GitHub
# merge every minor and patch update once CI passes, security updates included, and a merge to main deploys. GitHub
# Actions updates, major updates, and any PR that touches a dependency the python group's exclude-patterns names
# (discord.py and the dependencies installed from git) wait for a person: the workflow reads those names from here. So
# do pre-commit hook updates, whose projects promise no SemVer, except a PR that updates Black's hook alone: Black keeps
# formatting stable within a calendar year, and its year's first release comes as a major, which waits.
#
# The cooldown holds each release back until it is two weeks old, so nothing ships while it's days old.
version: 2

updates:
  # Poetry: pyproject.toml and poetry.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      python:
        update-types: ["minor", "patch"]
        exclude-patterns:
          # Pinned: PepperCord uses its internals.
          - "discord.py"
          # Installed from git at a pinned commit.
          - "discord-ext-menus"
          - "discord-ext-voice-recv"
          - "aioespn"
          - "aiosplatoon2ink"
          - "aiosplatoon3ink"

  # Dockerfile: uv and deno. The Debian base follows trixie's tag, which the weekly rebuild in docker-publish.yml refreshes.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      docker:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: ["minor", "patch"]

  # .pre-commit-config.yaml. black's and Poetry's hooks are also pinned in pyproject.toml, which the pip updates bump.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      pre-commit:
        update-types: ["minor", "patch"]
