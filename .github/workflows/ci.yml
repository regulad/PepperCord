name: CI

# Checks every pull request into main: the pre-commit hooks, the types, and the image on both architectures. main
# requires these checks (.github/settings.yml), which is what lets dependabot-auto-merge.yml merge Dependabot's PRs
# without a person: a merge to main deploys.
#
# Nothing here uses a secret, so it runs the same on Dependabot's PRs, which only see Dependabot secrets.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to a PR replaces the checks still running for its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same commands as tox.ini's lint and type environments. tox itself would try to build PepperCord as a package,
  # which it isn't (package-mode = false).
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Poetry at the version pyproject.toml pins, as the Dockerfile installs it.
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run the pre-commit hooks
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  type:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --with type --no-interaction
      - name: Run mypy
        run: poetry run mypy src tests

  test:
    runs-on: ubuntu-26.04
    # The watch store's tests run against a real MongoDB, of the series production runs.
    services:
      mongo:
        image: mongo:9.0
        ports:
          - 27017:27017
    env:
      PEPPERCORD_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run the tests
        run: poetry run pytest

  # Builds the runtime image natively on each architecture, then imports every extension inside it, as the bot loads
  # them. The private resources submodule isn't checked out: no extension reads it at import, and Dependabot's PRs
  # couldn't fetch it anyway.
  image:
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --tag peppercord:ci .
      - name: Import every extension in the image
        run: |
          docker run --rm -i --entrypoint python peppercord:ci - <<'EOF'
          import asyncio, importlib, sys
          sys.path.insert(0, "src")
          from utils.misc import get_python_modules


          async def main() -> None:
              # The bot imports its extensions inside its running event loop, and some read the loop at import time.
              modules = get_python_modules("extensions")
              for module in modules:
                  importlib.import_module(module)
              importlib.import_module("jishaku")
              print(f"Imported {len(modules)} extensions and jishaku on Python {sys.version.split()[0]}.")


          asyncio.run(main())
          EOF
