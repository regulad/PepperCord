name: Docker

on:
  workflow_dispatch:
  # Weekly, so the image picks up fixes in its Debian and Python base even when nothing is pushed.
  schedule:
    - cron: "41 6 * * 1"
  # testing is where a change gets the whole pipeline before it lands on main. It publishes latest-testing instead of
  # latest (see meta-tags). Deliberately no pull_request trigger: PRs never build here.
  push:
    branches: ["main", "testing"]
    tags: ["v*.*.*"]

# Serialize the pipeline per ref, across push, scheduled, and manual runs. Each new run cancels the active run and
# replaces any pending run on the same ref; a push to testing must not cancel main's run, or the other way round.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true
  queue: single

jobs:
  # docker/github-builder handles checkout (via a BuildKit git context), buildx, registry login, metadata, native
  # per-platform builds (arm64 on GitHub's arm64 runners, no QEMU), manifest-list merging, and signing.
  # https://github.com/docker/github-builder
  #
  # Building from the git tree means BuildKit skips .dockerignore and strips .git. The Dockerfile is written for that:
  # it copies by path, and takes the commit as the GIT_SHA build arg.
  #
  # note: env context isn't available inside a reusable workflow call's with:/secrets: blocks, so
  # ghcr.io/${{ github.repository }} is inlined rather than pulled from a top-level env: block.
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: "."
      file: "./Dockerfile"
      platforms: linux/amd64,linux/arm64
      # Both architectures are required for the final manifest.
      fail-fast: true
      cache: true
      cache-scope: peppercord
      cache-mode: max
      # GIT_SHA is declared at the end of the runtime stage, so a new commit only rebuilds the layers after it.
      build-args: |
        GIT_SHA=${{ github.sha }}
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      # latest on main, latest-testing on testing, the branch name on every branch push but testing's, a dated tag on
      # each scheduled rebuild, and the version on release tags.
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-testing
        type=schedule,pattern={{date 'YYYYMMDD'}}
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The resources submodule is private, and github.token can only read this repository. BuildKit fetches the
      # submodule with this token: for github.com remotes it reuses the context's token for every github.com URL.
      github-token: ${{ secrets.PAT }}
