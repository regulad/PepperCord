name: Docker

on:
  workflow_dispatch:
  # Weekly, so the image picks up fixes in its Debian and Python base even when nothing is pushed.
  schedule:
    - cron: "41 6 * * 1"
  # testing is where a change gets the whole pipeline before it lands on main. It publishes latest-testing instead of
  # latest (see meta-tags). Deliberately no pull_request trigger: PRs never build here.
  push:
    branches: ["main", "testing"]

# Serialize the pipeline per ref, across push, scheduled, and manual runs: one run at a time, and every run finishes.
# Each run on main creates a Sentry release and deploy and restarts production, so none may be cancelled or skipped.
# Pushes that arrive while a run is going wait in line (queue: max, up to 100) and run in order. A push carrying several
# commits is still one run, for the newest of them. testing and main queue separately.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # docker/github-builder handles checkout (via a BuildKit git context), buildx, registry login, metadata, native
  # per-platform builds (arm64 on GitHub's arm64 runners, no QEMU), manifest-list merging, and signing.
  # https://github.com/docker/github-builder
  #
  # Building from the git tree means BuildKit skips .dockerignore and strips .git. The Dockerfile is written for that:
  # it copies by path, and takes the commit as the GIT_SHA build arg.
  #
  # note: env context isn't available inside a reusable workflow call's with:/secrets: blocks, so
  # ghcr.io/${{ github.repository }} is inlined rather than pulled from a top-level env: block.
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: "."
      file: "./Dockerfile"
      platforms: linux/amd64,linux/arm64
      # Both architectures are required for the final manifest.
      fail-fast: true
      cache: true
      cache-scope: peppercord
      cache-mode: max
      # GIT_SHA is declared at the end of the runtime stage, so a new commit only rebuilds the layers after it.
      build-args: |
        GIT_SHA=${{ github.sha }}
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      # latest on main, latest-testing on testing, the branch name on every branch push but testing's, a dated tag on
      # each scheduled rebuild, and the raw commit hash on every build. Images are identified by commit, not version.
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-testing
        type=schedule,pattern={{date 'YYYYMMDD'}}
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }}
        type=sha,format=long,prefix=
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The resources submodule is private, and github.token can only read this repository. BuildKit fetches the
      # submodule with this token: for github.com remotes it reuses the context's token for every github.com URL.
      github-token: ${{ secrets.PAT }}

  # Tells both production hosts to update now, rather than at their daily podman-auto-update.timer run. Each host runs
  # webhookd on loopback behind Tailscale Serve, and the tailnet policy lets only tag:ci-client-peppercord reach it.
  # So the job joins the tailnet as that tag, through a Tailscale federated identity that trusts this repository's
  # main branch: its OIDC subject is repo:regulad@52430642/PepperCord@364397477:ref:refs/heads/main, the immutable
  # form, which names the owner and repository by ID as well as by name.
  #
  # The hook starts podman-auto-update.service and answers at once: 200 means the update started, and the stack
  # restarts within about a minute if latest's digest changed. Scheduled rebuilds run this too, since they publish a
  # new digest. A failure doesn't fail the run: the daily timer still picks the image up within a day.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # Mints the GitHub OIDC token the federated identity accepts; no long-lived Tailscale secret is stored.
      id-token: write
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-client-peppercord
          hostname: peppercord-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      # Every host is called even if an earlier one fails, then the step fails if any did.
      - name: Start the update on each host
        run: |
          failed=0
          for host in peppercord cordpepperer; do
            if curl -fsS --retry 3 --retry-connrefused -X POST "https://$host.tail11540.ts.net:8108/auto-update"; then
              echo "Started the update on $host."
            else
              echo "::warning::Couldn't start the update on $host; its daily podman-auto-update.timer run will pick latest up."
              failed=1
            fi
          done
          exit "$failed"

  # Tells Sentry about each image main publishes. It creates the release, named by the raw commit hash as the bot's
  # own events are (src/utils/reporting.py), links its commits through Sentry's GitHub integration, and records a
  # production deploy. It runs after deploy, so the deploy marks when the hosts were told to update; production runs
  # the image a minute or so later. If deploy failed, the release is still recorded, and the hosts' daily timer
  # delivers the image within a day. Scheduled rebuilds are skipped: same commit, nothing new to record.
  sentry-release:
    needs: [build, deploy]
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The whole history, so set_commits can find the commits since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: regulad
          SENTRY_PROJECT: peppercord
        with:
          release: ${{ github.sha }}
          environment: production
          set_commits: auto
          # The first release has no previous one to find commits since.
          ignore_missing: true
