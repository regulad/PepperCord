[tool.poetry]
name = "peppercord"
version = "10.0.0"
description = "A multi-purpose Discord bot written in Python."
authors = ["Parker Wahle <regulad@regulad.xyz>"]
license = "GPLv3"
package-mode = false

[tool.poetry.dependencies]
python = "~3.15.2"  # any 3.15 patch release: the image takes the newest one its pinned uv knows
aiofiles = "25.1.0"  # no semantic versioning -- has stubs
aiohttp = "^3.14.5"
"discord.py" = {version = "2.7.1", extras = ["voice", "speed"]}  # pinned -- internals used
gitpython = "^3.1.31"
jishaku = "^2.8.1"
mcstatus = "^14.2.0"
pillow = "^13.0.0"
psutil = "^7.2.2"
python-dateutil = "4.0.0"  # has stubs, which still cover the 2.9 API (all we use)
python-dotenv = "^1.2.1"
yt-dlp = {version = ">=2025.10.22", extras = ["default"]}  # very stable outward API
mc-formatting-sirnapkin1334 = {git = "https://github.com/Moire9/MC-Formatting.git",rev = "6f4796683e114cb7632814c577507c8bafecf88a"}
pymongo = {version = "^4.20.0", extras = ["srv"]}
discord-ext-menus = {git = "https://github.com/Rapptz/discord-ext-menus", rev = "8686b5d1bbc1d3c862292eb436ab630d6e9c9b53"}
pytz = "2026.6"  # has stubs
discord-ext-voice-recv = {git = "https://github.com/rdphillips7/discord-ext-voice-recv", rev = "ddd28601fe556f585b869e215f29c8236b95f88f"}  # track https://github.com/imayhaveborkedit/discord-ext-voice-recv/pull/54
aiorwlock = "^1.5.0"
sentry-sdk = "^2.73.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.7.0"
tox = "^4.67.13"
poetry = "2.5.1"  # Pinned in .pre-commit-config.yaml; the Dockerfile installs the version pinned here
black = "26.10.1"  # Pinned in .pre-commit-config.yaml

[tool.poetry.group.ci]
optional = true

[tool.poetry.group.ci.dependencies]
tox-gh-actions = "^3.5.0"

[tool.poetry.group.type.dependencies]
mypy = "^2.4.1"
types-aiofiles = "25.1.0.20261107"  # no semantic versioning
types-python-dateutil = "2.9.0.20261104"
types-pytz = "2026.6.0.20261031"

[tool.mypy]
mypy_path = "src"
namespace_packages = true  # even with this enabled, the vscode mypy ext doesn't capture them correctly
explicit_package_bases = true
follow_untyped_imports = true
# checks
disallow_any_unimported = true
disallow_any_generics = true
disallow_any_expr = false  # too iffy to waste time on
disallow_any_explicit = false
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
implicit_optional = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = ["deprecated"]
local_partial_types = true
extra_checks = true
implicit_reexport = false
strict_equality = true
strict_equality_for_none = true
strict_bytes = true
# formatting only
show_error_code_links = true
pretty = true
